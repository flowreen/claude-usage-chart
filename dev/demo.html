<!doctype html>
<!-- Harness: renders chart.html's UI with a fake chrome.* API and synthetic samples. Open as a file. -->
<html lang="en">
<head><meta charset="utf-8"><title>Claude Weekly Usage Demo</title></head>
<body>
<script>
(async () => {
  const loadScript = src => new Promise(r => { const s = document.createElement('script'); s.src = src; s.onload = r; document.body.appendChild(s); });
  await loadScript('../extension/pace.js'); // demo data uses finishWindow
  const H = 36e5;
  const points = [];
  // Usage only moves in work time, 09:00 to 17:00 local, so every curve goes flat for the 16 h the person is away,
  // like a real account. worked(a, b) = work ms inside [a, b]; workFrac replaces the plain time fraction as the
  // input of each usage curve. Weekends count as work days: flat weekends make the 24 h projection overshoot.
  const worked = (a, b) => {
    let ms = 0;
    const d = new Date(a);
    d.setHours(0, 0, 0, 0);
    for (; d.getTime() < b; d.setDate(d.getDate() + 1)) {
      ms += Math.max(0, Math.min(b, new Date(d).setHours(17)) - Math.max(a, new Date(d).setHours(9)));
    }
    return ms;
  };
  const workFrac = (t, start, end) => worked(start, t) / worked(start, end);
  // Two accounts with different reset times, plus one account's previous week.
  const accounts = [['org-a', 1.2, 1.0], ['org-b', 3.4, 0.6], ['org-a', 1.2 - 7, 0.8]];
  for (const [org, daysLeft, scale] of accounts) {
    const end = Date.now() + daysLeft * 864e5, start = end - 7 * 864e5;
    for (const [key, rate] of [['All models', 0.62], ['Fable', 0.95]]) {
      for (let t = start + 2 * H; t < Math.min(end, Date.now()); t += 2 * H) {
        const f = workFrac(t, start, end);
        let pct = Math.round(Math.min(100, scale * rate * 100 * f * f * 1.6));
        if (org === 'org-a' && t > Date.now() - 20 * H) pct = Math.round(pct * 0.72); // limit bump
        points.push({ t, org, key, pct, reset: end });
      }
    }
  }
  // Enterprise seat with only a monthly $ limit: this month so far ($500 limit), plus last month finishing on its
  // last working day.
  const now = new Date();
  for (const back of [1, 0]) {
    const mStart = Date.UTC(now.getUTCFullYear(), now.getUTCMonth() - back, 1);
    const mEnd = Date.UTC(now.getUTCFullYear(), now.getUTCMonth() - back + 1, 1);
    const fin = finishWindow(mEnd, mStart);
    // last month reaches 100% halfway through the work done inside its finish window
    const hit = (workFrac(fin.start, mStart, mEnd) + workFrac(fin.end, mStart, mEnd)) / 2;
    for (let t = mStart + 5 * H; t < Math.min(mEnd, Date.now()); t += 4 * H) {
      const f = workFrac(t, mStart, mEnd);
      let pct = back ? Math.min(100, 100 * f / hit) : 100 * f * 0.93;
      pct = Math.round(pct * 10) / 10;
      points.push({ t, org: 'org-c', key: 'Monthly spend', pct, reset: mEnd, start: mStart,
                    used: Math.round(pct * 5 * 100) / 100, limit: 500, currency: 'USD' });
    }
  }
  // ?fresh = first open after install: one sample per series
  if (location.search.includes('fresh')) {
    points.length = 0;
    const reset = Date.now() + 2.5 * 864e5;
    points.push({ t: Date.now(), org: 'org-a', key: 'All models', pct: 41, reset },
                { t: Date.now(), org: 'org-a', key: 'Fable', pct: 63, reset });
  }
  // ?scenario=s | a | monthly: the README pictures. s = a finished week that wandered under, over and back into
  // the zone (every dot colour) and hit 100% on the finish day; a = a finished week that hit 100% almost two days
  // early; monthly = a live Enterprise month.
  const scenario = new URLSearchParams(location.search).get('scenario');
  if (scenario === 's' || scenario === 'a') {
    points.length = 0;
    // the week resets at 09:00, so each of its days is 8 h of work then 16 h flat and the 2 h samples hit the corners
    const end = new Date(Date.now() - 2 * 864e5).setHours(9, 0, 0, 0), start = end - 7 * 864e5;
    // knots [work fraction, pct], eased between them; pct never decreases, so usage never goes down. The zone is
    // 21.4 points either side of the line, so under and over need swings of about 25.
    const path = knots => f => {
      const i = knots.findIndex(k => k[0] >= f);
      if (i < 0) return knots[knots.length - 1][1];
      if (i === 0) return knots[0][1];
      const [f0, p0] = knots[i - 1], [f1, p1] = knots[i];
      return p0 + (p1 - p0) * (1 - Math.cos(Math.PI * (f - f0) / (f1 - f0))) / 2;
    };
    const curve = {
      s: { 'All models': path([[0, 0], [0.3, 5], [0.45, 40], [0.55, 80], [0.62, 86], [0.8, 88], [0.9, 93], [0.955, 100]]),
           Fable: path([[0, 0], [0.2, 12], [0.42, 17], [0.56, 52], [0.7, 93], [0.86, 95], [0.965, 100]]) },
      a: { 'All models': path([[0, 0], [0.25, 45], [0.5, 76], [0.65, 89], [0.839, 100]]),
           Fable: f => Math.min(100, 100 * f * 1.45) },
    }[scenario];
    for (const [key, fn] of Object.entries(curve)) {
      for (let t = start + 2 * H; t < end - 0.5 * H; t += 2 * H) {
        const f = workFrac(t, start, end);
        const pct = Math.round(Math.min(100, Math.max(0, fn(f))) * 10) / 10;
        points.push({ t, org: 'org-a', key, pct, reset: end });
      }
    }
  }
  if (scenario === 'monthly') {
    points.length = 0;
    const mStart = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1);
    const mEnd = Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 1);
    for (let t = mStart + 5 * H; t < Date.now(); t += 4 * H) {
      const f = workFrac(t, mStart, mEnd);
      const pct = Math.round(Math.max(0, 100 * f + 3 * Math.sin(f * 9) - 1) * 10) / 10;
      points.push({ t, org: 'org-c', key: 'Monthly spend', pct, reset: mEnd, start: mStart,
                    used: Math.round(pct * 5 * 100) / 100, limit: 500, currency: 'USD' });
    }
  }
  const store = { points, orgNames: { 'org-a': "florin@example.com's Organization", 'org-b': 'Personal', 'org-c': 'Acme Corp' },
                  orgUsers: { 'org-a': 'Florin', 'org-c': 'Florin' },
                  orgPlans: { 'org-a': 'Max 20x', 'org-b': 'Pro', 'org-c': 'Enterprise' },
                  status: { t: Date.now(), ok: true, msg: 'demo data' } };
  window.chrome = {
    storage: {
      local: {
        get: async keys => Object.fromEntries([].concat(keys).map(k => [k, store[k]])),
        set: async o => Object.assign(store, o),
      },
      onChanged: { addListener() {} },
    },
    runtime: { sendMessage: async () => ({ t: Date.now(), ok: false, msg: 'demo: no poll' }) },
  };
  const html = await fetch('../extension/chart.html').then(r => r.text()).catch(() => null);
  if (!html) { document.body.textContent = 'serve the project root over http, then open /dev/demo.html'; return; }
  const doc = new DOMParser().parseFromString(html, 'text/html');
  document.head.append(...doc.head.children);
  document.querySelector('link[rel=icon]')?.setAttribute('href', '../extension/icons/icon32.png');
  document.body.innerHTML = doc.body.innerHTML.replace(/<script[^>]*><\/script>/g, '');
  await loadScript('../extension/chart.js'); // body was replaced, pace.js globals persist
})();
</script>
</body>
</html>
